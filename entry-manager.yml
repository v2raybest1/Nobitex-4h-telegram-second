name: Nobitex Entry Manager

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manager:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Telegram manager
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python nobitex_entry_manager.py

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add entry_watchlist_state.json telegram_offset.json
          git commit -m "update entry watcher state" || exit 0
          git push
