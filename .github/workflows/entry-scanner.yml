name: Nobitex Entry Scanner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python nobitex_entry_scanner.py

      - name: Save state files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add entry_last_report.json entry_watchlist_state.json
          git commit -m "update entry scanner state" || exit 0
          git push
