name: Nobitex Symbol Filter Final

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run symbol ranking
        run: |
          python nobitex_symbol_filter.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: symbol-ranking
          path: symbol_ranking.json
